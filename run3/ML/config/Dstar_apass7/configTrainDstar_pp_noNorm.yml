input: # files to use, set FD to null for binary classification
    prompt: /data/lagliett/HF_data/TrainingBDTapass7/filtered/Prompt_Dstar_pprun3_LHC24d3_pT_0_100.parquet.gzip
    FD: /data/lagliett/HF_data/TrainingBDTapass7/filtered/FD_Dstar_pprun3_LHC24d3_pT_0_100.parquet.gzip
    data: /data/lagliett/HF_data/TrainingBDTapass7/filtered/Data_Dstar_pprun3_LHC22pass7_pT_0_100.parquet.gzip
    treename: null

output:
    leg_labels: # legend labels, keep the right number of classes
        Bkg: Background
        Prompt: Prompt D*$^+$
        FD: Feed-down D*$^+$
    out_labels: # output labels, keep the right number of classes
        Bkg: Bkg
        Prompt: Prompt
        FD: FD
    dir: '/home/lagliett/outputML/apass7Dstar/all' # output dir

pt_ranges: # ranges in pt to split the data in the ml training and testing
    min: [1, 2, 3, 5, 7, 10, 15, 20] # list
    max: [2, 3, 5, 7, 10, 15, 20, 50] # list

data_prep:
    filt_bkg_mass: fDeltaM > 0.155 # pandas query to select bkg candidates
    dataset_opt: equal  # change how the dataset is built, options available: 'equal', 'max_signal'
                        # 'equal' -> same number of prompt/FD/bkg (not using all the signal available)
                        # 'max_signal' -> try to use all the signal (prompt and FD) + add n_bkg = 2 * (n_prompt + n_FD)
    bkg_mult: [1., 1., 1., 1., 1., 1., 1., 1.] # list of multipliers for (nPrompt + nFD) used to determine nCandBkg in the 'max_signal' option
    seed_split: 42 # seed used for train_test_split(...)
    test_fraction: 0.2 # fraction of data used for test set and efficiencies     

ml:
    raw_output: False # use raw_output (True) of probability (False) as output of the model
    roc_auc_average: 'macro' # 'macro' or 'weighted'
    roc_auc_approach: 'ovo'  # 'ovo' or 'ovr'
    training_columns: ["fDecayLengthD0", "fDecayLengthXYD0", "fCpaD0", "fCpaXYD0", "fImpactParameterProductD0", "fCosThetaStarD0",
                       "fNSigTpcTofPi0", "fNSigTpcTofKa0", "fNSigTpcTofPi1", "fNSigTpcTofKa1",
                       "fImpParamSoftPi", "fPtSoftPi", "fNSigTpcTofPiSoftPi", "fNSigTpcTofKaSoftPi"] 
                       # list of training variables
    hyper_par: [
            {'max_depth':4, 'learning_rate':0.029, 'n_estimators':500, 'min_child_weight':2.7, 'subsample':0.90, 'colsample_bytree':0.97, 'n_jobs':8, 'tree_method':hist, 'lambda':0.01},
            {'max_depth':4, 'learning_rate':0.029, 'n_estimators':500, 'min_child_weight':2.7, 'subsample':0.90, 'colsample_bytree':0.97, 'n_jobs':8, 'tree_method':hist, 'lambda':0.01},
            {'max_depth':4, 'learning_rate':0.029, 'n_estimators':500, 'min_child_weight':2.7, 'subsample':0.90, 'colsample_bytree':0.97, 'n_jobs':8, 'tree_method':hist, 'lambda':0.01},
            {'max_depth':4, 'learning_rate':0.029, 'n_estimators':500, 'min_child_weight':2.7, 'subsample':0.90, 'colsample_bytree':0.97, 'n_jobs':8, 'tree_method':hist, 'lambda':0.01},
            {'max_depth':4, 'learning_rate':0.029, 'n_estimators':500, 'min_child_weight':2.7, 'subsample':0.90, 'colsample_bytree':0.97, 'n_jobs':8, 'tree_method':hist, 'lambda':0.01},
            {'max_depth':4, 'learning_rate':0.029, 'n_estimators':500, 'min_child_weight':2.7, 'subsample':0.90, 'colsample_bytree':0.97, 'n_jobs':8, 'tree_method':hist, 'lambda':0.01},
            {'max_depth':4, 'learning_rate':0.029, 'n_estimators':500, 'min_child_weight':2.7, 'subsample':0.90, 'colsample_bytree':0.97, 'n_jobs':8, 'tree_method':hist, 'lambda':0.01},
            {'max_depth':4, 'learning_rate':0.029, 'n_estimators':500, 'min_child_weight':2.7, 'subsample':0.90, 'colsample_bytree':0.97, 'n_jobs':8, 'tree_method':hist, 'lambda':0.01}
        ]
                # list of dicts of hyperparameters (one for each pT bin)
    hyper_par_opt:
        do_hyp_opt: True # whether to do the parameter optimization
        njobs: 12 # number of parallel jobs used in hyper-parameter optimization, -1. to use all
        nfolds: 5 # number of folds used in cross validation
        initpoints: 10 # steps of random exploration you want to perform
        n_trials: 15 # steps for bayesian optimization
        timeout: null
        opt_tuna_config: {'max_depth': !!python/tuple [1, 4], 
                            'learning_rate': !!python/tuple [0.01, 0.1],
                            'n_estimators': !!python/tuple [300, 1500], 
                            'min_child_weight': !!python/tuple [1, 10],
                            'subsample': !!python/tuple [0.8, 1.], 
                            'colsample_bytree': !!python/tuple [0.8, 1.],
                            'lambda': !!python/tuple [0., 0.001]}
                            # configuration dictionary for optimize_params_bayes()
    
    
    saved_models: [/home/lagliett/outputML/apass7Dstar/all/pt1_2/ModelHandler_pT_1_2.pickle, 
                   /home/lagliett/outputML/apass7Dstar/all/pt2_3/ModelHandler_pT_2_3.pickle, 
                   /home/lagliett/outputML/apass7Dstar/all/pt3_5/ModelHandler_pT_3_5.pickle,
                   /home/lagliett/outputML/apass7Dstar/all/pt5_7/ModelHandler_pT_5_7.pickle,  
                   /home/lagliett/outputML/apass7Dstar/all/pt7_10/ModelHandler_pT_7_10.pickle, 
                   /home/lagliett/outputML/apass7Dstar/all/pt10_15/ModelHandler_pT_10_15.pickle,
                   /home/lagliett/outputML/apass7Dstar/all/pt15_20/ModelHandler_pT_15_20.pickle,
                   /home/lagliett/outputML/apass7Dstar/all/pt20_50/ModelHandler_pT_20_50.pickle] # list of saved ModelHandler (path+file), compatible with the pt bins # list of saved ModelHandler (path+file), compatible with the pt bins

plots:
    plotting_columns: ['fDeltaM', 'fPt', 
                       "fDecayLengthD0", "fDecayLengthXYD0", "fCpaD0", "fCpaXYD0", "fImpactParameterProductD0", "fCosThetaStarD0",
                       "fNSigTpcTofPi0", "fNSigTpcTofKa0", "fNSigTpcTofPi1", "fNSigTpcTofKa1",
                       "fImpParamSoftPi", "fPtSoftPi", "fNSigTpcTofPiSoftPi", "fNSigTpcTofKaSoftPi"
                        ] 
                       # list of variables to plot
    train_test_log: True # use log scale for plots of train and test distributions
  
appl: 
    column_to_save_list: ['fM', 'fPt'] # list of variables saved in the dataframes with the applied models

standalone_appl:
    treename: null # null if using parquet
    inputs: [] # list of parquet files for the model application
    output_names: [] # names for the outputs (one for each file)
    output_dir: null # output directory

conversion:
    output_folder : '/home/lagliett/outputML/apass7Dstar/all/converted/'